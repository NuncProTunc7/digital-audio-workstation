[workspace]
resolver = "3"
members = ["crates/*", "app/src-tauri"]

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/NuncProTunc7/digital-audio-workstation"
authors = ["Nunc Pro Tune contributors"]

[workspace.dependencies]
daw-model = { path = "crates/daw-model" }
daw-audio = { path = "crates/daw-audio" }
daw-engine = { path = "crates/daw-engine", default-features = false }
cpal = "0.18"
hound = "3.5"
schemars = "1.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
clap = { version = "4.6", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"

[profile.release]
lto = "thin"

# Audio code must run in real time even in development builds, or playback
# stutters. Optimize the DSP crates (and all dependencies) in dev too.
[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.daw-dsp]
opt-level = 3

[profile.dev.package.daw-instruments]
opt-level = 3

[profile.dev.package.daw-effects]
opt-level = 3

[profile.dev.package.daw-engine]
opt-level = 3

[profile.dev.package.daw-audio]
opt-level = 3
