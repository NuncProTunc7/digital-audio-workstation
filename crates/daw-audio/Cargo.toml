[package]
name = "daw-audio"
description = "Audio files for Nunc Pro Tune: import (wav, mp3, m4a/AAC, flac, ogg), resampling, waveform peaks, and the project's audio folder."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
hound.workspace = true
rubato = "5.0.1"
serde.workspace = true
symphonia = { version = "0.6.1", default-features = false, features = ["wav", "pcm", "mp3", "aac", "isomp4", "flac", "ogg", "vorbis", "alac", "adpcm"] }
thiserror.workspace = true

[dev-dependencies]
tempfile = "3.27.0"
