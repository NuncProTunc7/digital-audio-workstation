[package]
name = "daw-engine"
description = "Nunc Pro Tune real-time audio engine and headless renderer."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = ["device"]
# Sound card output (cpal) and MIDI input (midir). Off for headless builds
# that never touch hardware.
device = ["dep:cpal", "dep:midir"]

[dependencies]
cpal = { workspace = true, optional = true }
daw-dsp = { path = "../daw-dsp" }
daw-effects = { path = "../daw-effects" }
daw-instruments = { path = "../daw-instruments" }
daw-model.workspace = true
midir = { version = "0.11", optional = true }
rtrb = "0.4"
thiserror.workspace = true

[lints]
workspace = true
