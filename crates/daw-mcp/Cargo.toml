[package]
name = "daw-mcp"
description = "Nunc Pro Tune MCP server: lets Claude Desktop and Claude Code control the app."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "npt-mcp"
path = "src/main.rs"

[dependencies]
daw-control = { path = "../daw-control" }
daw-model.workspace = true
rmcp = { version = "3.5", default-features = false, features = ["server", "transport-io"] }
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std"] }

[dev-dependencies]
daw-engine = { workspace = true }

[lints]
workspace = true
