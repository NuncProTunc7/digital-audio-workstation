name: Release

# Pushing a version tag (v0.2.0, v1.0.0...) builds the Windows installer and
# publishes it as a GitHub Release anyone can download without signing in.
# The tag must match the version in Cargo.toml, app/package.json, and
# app/src-tauri/tauri.conf.json (the job checks).
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Windows installer release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check the tag matches the app version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for f in app/package.json app/src-tauri/tauri.conf.json; do
            grep -q "\"version\": \"$tag\"" "$f" || { echo "$f is not version $tag"; exit 1; }
          done
          grep -q "^version = \"$tag\"" Cargo.toml || { echo "Cargo.toml is not version $tag"; exit 1; }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npm run build
        working-directory: app
      - run: cargo test --workspace
      # The installer ships the Claude bridge (npt-mcp.exe) next to the app.
      - run: cargo build --release -p daw-mcp
      # With the update-signing key (repository secret), the build also
      # signs the installer so installed apps can update themselves.
      - name: Build installer
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            npm run tauri build -- --config src-tauri/tauri.release.conf.json
          else
            echo "No TAURI_SIGNING_PRIVATE_KEY secret: building without auto-update files."
            npm run tauri build -- --config src-tauri/tauri.installer.conf.json
          fi
        working-directory: app
      # GitHub turns spaces in file names into dots; use plain names so the
      # update link below matches.
      - name: Name the files and write the update manifest
        shell: bash
        run: |
          ver="${GITHUB_REF_NAME#v}"
          mkdir -p dist-release
          exe=$(ls target/release/bundle/nsis/*-setup.exe | head -1)
          cp "$exe" "dist-release/NuncProTune_${ver}_x64-setup.exe"
          if [ -f "$exe.sig" ]; then
            cp "$exe.sig" "dist-release/NuncProTune_${ver}_x64-setup.exe.sig"
            sig=$(cat "$exe.sig")
            url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/NuncProTune_${ver}_x64-setup.exe"
            node -e 'const [v,s,u]=process.argv.slice(1); console.log(JSON.stringify({version:v, notes:"See the release page for what changed.", pub_date:new Date().toISOString(), platforms:{"windows-x86_64":{signature:s,url:u}}}, null, 2))' "$ver" "$sig" "$url" > dist-release/latest.json
          fi
          ls -la dist-release
      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          name: Nunc Pro Tune ${{ github.ref_name }}
          files: dist-release/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            Download the `.exe` below and run it to install or update Nunc Pro Tune.
            Windows may warn that the installer is unsigned: click **More info → Run anyway**.
